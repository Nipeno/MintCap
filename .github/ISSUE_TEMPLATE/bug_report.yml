name: Bug report
description: Something broke — addon not loading, FPS not capping, overlay missing, etc.
title: "[Bug]: "
labels: ["bug", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. Most problems turn out to be install- or ReShade-version-related, and
        the questions below catch the common ones. Anything you don't know, leave blank — a partial
        report beats no report.
  - type: checkboxes
    id: preflight
    attributes:
      label: Before you start
      options:
        - label: I've read the install guide that came with the zip (or the README).
          required: true
        - label: I searched the [existing issues](https://github.com/Nipeno/MintCap/issues?q=is%3Aissue) for this.
          required: true
  - type: dropdown
    id: game
    attributes:
      label: Where does this happen?
      options:
        - FiveM
        - Another game
        - Not game-specific (docs, the zip, the .bat, CI...)
    validations:
      required: true
  - type: input
    id: game-name
    attributes:
      label: Which game?
      description: Only if you picked "Another game" above.
      placeholder: e.g. Cyberpunk 2077, Skyrim SE, RDR2
    validations:
      required: false
  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: What went wrong, and what did you expect instead?
      placeholder: FPS still uncapped / overlay won't open / game crashes on launch / ...
    validations:
      required: true
  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. Extracted the zip to ...
        2. Put MintCap.addon64 in ...
        3. Launched the game, pressed Home
        4. ...
    validations:
      required: true
  - type: dropdown
    id: install-type
    attributes:
      label: How is ReShade installed?
      options:
        - Used the bundled dxgi.dll from the zip
        - Installed ReShade myself with the official installer (add-on support)
        - Already had it from a graphics pack (NVE / QuantV / other)
        - Other / not sure
    validations:
      required: true
  - type: input
    id: reshade-version
    attributes:
      label: ReShade version
      description: Shown on the "About" tab of the ReShade overlay.
      placeholder: e.g. 6.8.0
    validations:
      required: false
  - type: input
    id: addon-version
    attributes:
      label: MintCap version
      description: Shown in the overlay under "Made by Nipeno", and in the zip name (MintCap_v<ver>.zip).
      placeholder: e.g. v1.0.0
    validations:
      required: true
  - type: input
    id: overlay-key
    attributes:
      label: Overlay key tried
      description: Default is Home, but some setups (NVE, for one) remap it to Insert. Did either open the ReShade menu?
      placeholder: e.g. Home — nothing; Insert — opened
    validations:
      required: false
  - type: dropdown
    id: enabled
    attributes:
      label: FiveM only — did you run Enable-ReShade.bat?
      description: FiveM blocks ReShade until it's acknowledged once in CitizenFX.ini. Skip this if you're not on FiveM.
      options:
        - "Yes — ran the .bat"
        - "Yes — edited CitizenFX.ini by hand"
        - "No"
        - "Not sure"
        - "Not applicable — not FiveM"
    validations:
      required: false
  - type: input
    id: windows
    attributes:
      label: Windows version
      placeholder: e.g. Windows 11 23H2
    validations:
      required: false
  - type: textarea
    id: logs
    attributes:
      label: ReShade log
      description: |
        `ReShade.log` sits next to the ReShade `.dll` you installed — for FiveM that's
        `%LOCALAPPDATA%\FiveM\FiveM.app`, for other games it's usually the folder with the game's
        `.exe`. MintCap writes to it, so it often names the problem outright. Drag-drop the file here.
    validations:
      required: false
